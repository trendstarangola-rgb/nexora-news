name: Build APK

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Nexora News
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do GitHub
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Arquivos do repositorio:"
          ls -lah

      - name: Descompactar projeto
        run: |
          mkdir -p nexora-project
          unzip -o "nexora-news-apk-ready.zip" -d nexora-project

          echo "Projeto extraido:"
          find nexora-project -maxdepth 4 -type f | head -100

      - name: Localizar projeto Android
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "nexora-project/gradlew" ]; then
            PROJECT_DIR="nexora-project"
          else
            FOUND_GRADLEW=$(find nexora-project -type f -name "gradlew" -print -quit)

            if [ -n "$FOUND_GRADLEW" ]; then
              PROJECT_DIR=$(dirname "$FOUND_GRADLEW")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: gradlew nao encontrado."
            find nexora-project -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissao ao Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Verificar Gradle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew --version

      - name: Limpar projeto
        run: |
          cd "$PROJECT_DIR"
          ./gradlew clean --stacktrace --no-daemon

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-News-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
