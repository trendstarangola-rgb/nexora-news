name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos
        run: |
          echo "Arquivos do repositório:"
          ls -la
          echo ""
          echo "Procurando projeto Android..."
          find . -maxdepth 4 -type f \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) -print

      - name: Preparar projeto
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "ZIP encontrado: $ZIP_FILE"
            mkdir -p android-project
            unzip -o "$ZIP_FILE" -d android-project
          else
            echo "Nenhum ZIP encontrado. Usando arquivos do repositório."
          fi

      - name: Encontrar projeto Android
        run: |
          GRADLEW=$(find . -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERRO: não foi encontrado o arquivo gradlew."
            echo "Estrutura encontrada:"
            find . -maxdepth 5 -type f | head -n 200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "gradlew encontrado em: $GRADLEW"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissão ao Gradle
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Limpar projeto
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean

      - name: Compilar APK Debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Procurar APK
        run: |
          echo "APKs gerados:"
          find . -type f -name "*.apk" -print

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-News-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
