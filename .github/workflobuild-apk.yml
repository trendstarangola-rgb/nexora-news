name: Build APK

on:
  push:
    branches:
      - principal
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Nexora News
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        run: |
          mkdir -p nexora-project
          unzip -o nexora-news-apk-ready.zip -d nexora-project

      - name: Localizar projeto Android
        run: |
          PROJECT_DIR=$(find nexora-project -name gradlew -type f -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: gradlew nao encontrado."
            find nexora-project -maxdepth 6 -type f
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Dar permissao ao Gradle
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexora-News-APK
          path: |
            ${{ env.PROJECT_DIR }}/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
